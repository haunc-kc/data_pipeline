name: CD - Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'pipelines/**'
      - 'configs/**'
      - 'utils/**'
      - 'databricks.yml'

env:
  DIM_PIPELINE_ID: d2b84c0f-d30e-49d0-a39d-f4d536c3c427
  
jobs:
  deploy:
    name: Deploy & Run ETL Pipeline Job
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy bundle
        run: databricks bundle deploy --target prod --auto-approve
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # ── Stop active dim pipeline run before triggering a new one ──
      - name: Stop active dim pipeline update (if running)
        run: |
          STATE=$(databricks pipelines get $DIM_PIPELINE_ID --output json | python3 -c "import sys,json; print(json.load(sys.stdin).get('state',''))")
          echo "dim_pipeline state: $STATE"
          if [ "$STATE" = "RUNNING" ]; then
            echo "Stopping active dim pipeline update..."
            databricks pipelines stop $DIM_PIPELINE_ID
            echo "Waiting for dim pipeline to become IDLE..."
            for i in $(seq 1 30); do
              sleep 10
              STATE=$(databricks pipelines get $DIM_PIPELINE_ID --output json | python3 -c "import sys,json; print(json.load(sys.stdin).get('state',''))")
              echo "  state: $STATE"
              if [ "$STATE" = "IDLE" ]; then break; fi
            done
          fi
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # ── Run the full ETL pipeline job (dim_pipelines, facts_job, etl_control,
      #    inform_be, churn_risk_predict — see databricks.yml) ──
      - name: Run etl_pipeline_job
        run: databricks bundle run etl_pipeline_job --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  notify-failure:
    name: Notify on Failure
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Log failure
        run: echo "Deployment failed — check workflow logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
