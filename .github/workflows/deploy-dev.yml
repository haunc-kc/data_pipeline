name: CD - Deploy to Dev

# Dev is code-sync only: pushes notebooks/files to the dev workspace path.
# No pipelines or jobs are deployed here — those are created and managed
# manually in the Databricks UI, pointing at the synced code.

on:
  workflow_dispatch: {}   # manual trigger from the GitHub Actions tab
  push:
    branches: [develop]
    paths:
      - 'pipelines/**'
      - 'configs/**'
      - 'utils/**'
      - 'databricks.yml'

jobs:
  deploy:
    name: Sync Code to Dev
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy bundle (code sync only, no resources)
        run: databricks bundle deploy --target dev --auto-approve
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  notify-failure:
    name: Notify on Failure
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Log failure
        run: echo "Dev deployment failed — check workflow logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
