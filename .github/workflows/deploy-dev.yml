name: CD - Deploy to Dev

on:
  workflow_dispatch: {}   # manual trigger from the GitHub Actions tab
  push:
    branches: [develop]
    paths:
      - 'pipelines/**'
      - 'resources/**'
      - 'configs/**'
      - 'utils/**'
      - 'databricks.yml'

env:
  DIM_PIPELINE_ID: e95d48dd-db97-4ea3-8e54-3a88f3279578

jobs:
  deploy:
    name: Deploy & Run Dim Pipeline (Dev)
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy bundle
        run: databricks bundle deploy --target dev --auto-approve
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # ── Stop active dim pipeline run before triggering a new one ──
      - name: Stop active dim pipeline update (if running)
        run: |
          STATE=$(databricks pipelines get $DIM_PIPELINE_ID --output json | python3 -c "import sys,json; print(json.load(sys.stdin).get('state',''))")
          echo "dim_pipeline state: $STATE"
          if [ "$STATE" = "RUNNING" ]; then
            echo "Stopping active dim pipeline update..."
            databricks pipelines stop $DIM_PIPELINE_ID
            echo "Waiting for dim pipeline to become IDLE..."
            for i in $(seq 1 30); do
              sleep 10
              STATE=$(databricks pipelines get $DIM_PIPELINE_ID --output json | python3 -c "import sys,json; print(json.load(sys.stdin).get('state',''))")
              echo "  state: $STATE"
              if [ "$STATE" = "IDLE" ]; then break; fi
            done
          fi
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # ── Run dim pipeline (dims must be up to date before fact jobs run) ──
      - name: Run dim pipeline
        run: databricks bundle run dim_pipeline --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  notify-failure:
    name: Notify on Failure
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Log failure
        run: echo "Dev deployment failed — check workflow logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
