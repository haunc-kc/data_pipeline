variables:
  pipeline_schema:
    default: mention_dw

resources:
  pipelines:
    fact_pipeline:
      name: fact_pipelines
      catalog: workspace
      schema: ${var.pipeline_schema}
      photon: true
      serverless: true
      channel: CURRENT
      continuous: false
      configuration:
        PIPELINE_SCHEMA: ${var.pipeline_schema}
        PIPELINE_CATALOG: workspace
      libraries:
        - glob:
            include: ${workspace.file_path}/pipelines/facts/silver/**
        - glob:
            include: ${workspace.file_path}/pipelines/facts/gold/**
